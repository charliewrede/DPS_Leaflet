<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.control.layers.tree@1.2.0/L.Control.Layers.Tree.css" />
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #map {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;
        }

        /* ============================================================
    LAYER CONTROL
    ============================================================ */

        .leaflet-control-layers {
            max-height: 45vh;
            overflow-y: auto;
            overscroll-behavior: contain;
            background: rgba(255, 255, 255, 0.95);
        }

        .control-toggle-button {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 5px;

            padding: 6px 10px;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: none;
        }

        .control-toggle-button:hover {
            background: #f4f4f4;
        }

        .control-toggle-switch {
            display: flex;
            align-items: center;
            gap: 8px;

            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 5px;

            padding: 6px 10px;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
        }

        .layer-toggle-fixed,
        .legend-toggle-fixed {
            position: fixed !important;
            z-index: 1000;
        }


        .toggle-switch {
            position: relative;
            display: inline-block;

            width: 34px;
            height: 18px;
        }


        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }


        .toggle-slider {
            position: absolute;

            cursor: pointer;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            background: #BBBBBB;

            border-radius: 18px;

            transition: 0.2s;
        }


        .toggle-slider::before {
            content: "";

            position: absolute;

            width: 14px;
            height: 14px;

            left: 2px;
            bottom: 2px;

            background: white;

            border-radius: 50%;

            transition: 0.2s;
        }


        .toggle-switch input:checked+.toggle-slider {
            background: #4CAF50;
        }


        .toggle-switch input:checked+.toggle-slider::before {
            transform: translateX(16px);
        }

        /* ============================================================
    LEGEND
    ============================================================ */

        .info.legend {
            padding: 10px 12px;
            background: white;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            line-height: 22px;
            color: #333;
            max-height: 45vh;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .info.legend h4 {
            margin: 0 0 6px 0;
            font-size: 15px;
        }

        .info.legend .legend-section {
            clear: both;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        /* Square symbols */

        .info.legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 1;
        }

        /* Circle symbols */

        .info.legend .circle-symbol {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin: 3px 8px 0 3px;
        }

        /* Line symbols */

        .info.legend .line-symbol {
            width: 20px;
            height: 0;
            margin-top: 10px;
            border-top: 3px solid;
            background: none;
        }

        /* Polygon symbol */

        .info.legend .polygon-symbol {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }

        /* ============================================================
PROTECTIVE POINT SYMBOLS
============================================================ */

        .protective-div-icon {
            background: transparent !important;
            border: none !important;
        }


        .protective-marker-shape {
            position: relative;

            width: 16px;
            height: 16px;

            background: #FFFFFF;

            clip-path: var(--shape-path);

            filter:
                drop-shadow(0 1px 1px rgba(0, 0, 0, 0.45));
        }


        .protective-marker-shape::after {
            content: "";

            position: absolute;

            inset: 2px;

            background:
                var(--marker-color);

            clip-path:
                var(--shape-path);
        }


        /* Legend version */

        .protective-legend-symbol {
            position: relative;

            display: inline-block;

            float: left;

            width: 14px;
            height: 14px;

            margin:
                4px 8px 0 2px;

            background: #FFFFFF;

            clip-path:
                var(--shape-path);
        }


        .protective-legend-symbol::after {
            content: "";

            position: absolute;

            inset: 2px;

            background:
                var(--marker-color);

            clip-path:
                var(--shape-path);
        }


        /* ============================================================
SHAPES
============================================================ */

        /* Food Access */
        .protective-shape-diamond {
            --shape-path:
                polygon(50% 0,
                    100% 50%,
                    50% 100%,
                    0 50%);
        }


        /* Recreation Centers */
        .protective-shape-square {
            --shape-path:
                polygon(0 0,
                    100% 0,
                    100% 100%,
                    0 100%);
        }


        /* Recreation Courts */
        .protective-shape-circle {
            --shape-path:
                circle(50%);
        }


        /* Afterschool Programs */
        .protective-shape-triangle {
            --shape-path:
                polygon(50% 0,
                    100% 100%,
                    0 100%);
        }


        /* Health Facilities */
        .protective-shape-cross {
            --shape-path:
                polygon(35% 0,
                    65% 0,
                    65% 35%,
                    100% 35%,
                    100% 65%,
                    65% 65%,
                    65% 100%,
                    35% 100%,
                    35% 65%,
                    0 65%,
                    0 35%,
                    35% 35%);
        }


        /* Libraries */
        .protective-shape-book {
            --shape-path:
                polygon(3% 10%,
                    43% 15%,
                    50% 22%,
                    57% 15%,
                    97% 10%,
                    97% 90%,
                    57% 85%,
                    50% 92%,
                    43% 85%,
                    3% 90%);
        }


        /* Swimming Pools */
        .protective-shape-drop {
            --shape-path:
                polygon(50% 0,
                    72% 28%,
                    88% 52%,
                    92% 68%,
                    84% 84%,
                    70% 96%,
                    50% 100%,
                    30% 96%,
                    16% 84%,
                    8% 68%,
                    12% 52%,
                    28% 28%);
        }


        /* Skateparks */
        .protective-shape-hexagon {
            --shape-path:
                polygon(25% 0,
                    75% 0,
                    100% 50%,
                    75% 100%,
                    25% 100%,
                    0 50%);
        }


        /* Arts / Culture / Amphitheaters */
        .protective-shape-star {
            --shape-path:
                polygon(50% 0,
                    61% 35%,
                    98% 35%,
                    68% 57%,
                    79% 94%,
                    50% 72%,
                    21% 94%,
                    32% 57%,
                    2% 35%,
                    39% 35%);
        }


        /* ============================================================
    NEIGHBORHOOD LABELS
    ============================================================ */

        .neighborhood-label {
            background: transparent;
            border: none;
            box-shadow: none;

            color: #000000;

            font-family: Arial, sans-serif !important;
            font-weight: 900 !important;
            font-style: normal !important;

            white-space: normal;

            text-align: center;

            line-height: 1.05;

            pointer-events: none;

            transition:
                font-size 0.15s ease,
                opacity 0.15s ease;
        }


        /* Force ALL text inside neighborhood labels to stay bold */
        .neighborhood-label,
        .neighborhood-label *,
        .leaflet-tooltip.neighborhood-label,
        .leaflet-tooltip.neighborhood-label * {
            font-family: Arial, sans-serif !important;
            font-weight: 900 !important;
            font-style: normal !important;
        }


        /* Slightly reinforce very small text */
        .neighborhood-label {
            -webkit-text-stroke: 0.15px currentColor;
        }


        .neighborhood-label::before {
            display: none;
        }

        /* ============================================================
    TOP 5 SCHOOL RANK MARKERS
    ============================================================ */

        .top-school-marker {
            width: 18px;
            height: 18px;

            background: #FFFFFF;

            border: 2px solid #000000;
            border-radius: 50%;

            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);

            pointer-events: auto;
        }


        /* Number inside map marker */
        .top-school-marker .rank-number {
            display: block;

            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: 900;

            line-height: 1;

            text-align: center;

            /* Optical correction for Arial numerals */
            transform: translateY(-0.2px);
        }


        .traditional-school-marker .rank-number {
            color: #000000;
        }


        .alternative-school-marker .rank-number {
            color: #F50000;
        }



        /* ============================================================
    TOP 5 SCHOOL LEGEND SYMBOLS
    ============================================================ */

        .school-rank-legend {
            width: 20px;
            height: 20px;

            background: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 50%;

            box-sizing: border-box;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            margin-right: 8px;

            vertical-align: middle;

            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 900;
            line-height: 1;

            /* Prevent other legend CSS from interfering */
            float: none !important;
            opacity: 1 !important;
        }


        /* Fine-tune the actual letter independently */
        .school-rank-legend .legend-letter {
            display: block;

            width: 100%;

            text-align: center;

            font: inherit;
            line-height: 1;

            /* Optical centering */
            transform: translateY(-0.5px);
        }


        /* Traditional */
        .traditional-school-legend {
            color: #000000;
        }


        /* Alternative */
        .alternative-school-legend {
            color: #F50000;
        }

        /* ============================================================
    ADDRESS SEARCH
    ============================================================ */

        .address-search-control {
            position: relative;

            width: 320px;

            background: #FFFFFF;

            border-radius: 4px;

            box-shadow:
                0 1px 5px rgba(0, 0, 0, 0.65);

            font-family: Arial, sans-serif;
        }


        .address-search-input {
            width: 100%;

            box-sizing: border-box;

            padding: 9px 12px;

            border: none;

            border-radius: 4px;

            outline: none;

            font-family: Arial, sans-serif;

            font-size: 14px;

            background: #FFFFFF;
        }


        .address-search-results {
            display: none;

            position: absolute;

            top: calc(100% + 2px);

            left: 0;

            width: 100%;

            max-height: 250px;

            overflow-y: auto;

            background: #FFFFFF;

            border-radius: 4px;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.35);

            z-index: 2000;
        }


        .address-search-result {
            padding: 9px 12px;

            border-bottom:
                1px solid #DDDDDD;

            cursor: pointer;

            font-size: 13px;

            line-height: 1.3;
        }


        .address-search-result:last-child {
            border-bottom: none;
        }


        .address-search-result:hover {
            background: #F2F2F2;
        }


        .address-search-status {
            padding: 9px 12px;

            font-size: 13px;

            color: #555555;
        }
    </style>
</head>


<body>

    <h1>Denver Social Vulnerability Map</h1>

    <div id="map"></div>


    <!-- Leaflet JavaScript -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.control.layers.tree@1.2.0/L.Control.Layers.Tree.js"></script>
    <script>

        // ============================================================
        // CREATE MAP
        // ============================================================

        var map = L.map('map').setView(
            [39.7392, -104.9903],
            10
        );
        // Keep popup widths readable
        L.Popup.mergeOptions({
            maxWidth: 350
        });


        // ============================================================
        // BASEMAP
        // ============================================================

        var osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        // ============================================================
        // GEOAPIFY ADDRESS SEARCH
        // ============================================================

        var geoapifyApiKey =
            "b6a94e57cd704f0183f26b5b58ad5d78";


        var addressSearchMarker =
            null;


        var addressSearchTimeout =
            null;


        var addressSearchController =
            null;


        // Approximate Denver metro search area
        var denverMetroBounds =
            L.latLngBounds(
                [39.45, -105.35],
                [40.10, -104.55]
            );


        // ============================================================
        // CREATE SEARCH CONTROL
        // ============================================================

        var AddressSearchControl =
            L.Control.extend({

                options: {
                    position: "topright"
                },


                onAdd: function () {

                    var container =
                        L.DomUtil.create(
                            "div",
                            "address-search-control"
                        );


                    var input =
                        L.DomUtil.create(
                            "input",
                            "address-search-input",
                            container
                        );


                    input.type =
                        "text";

                    input.placeholder =
                        "Search address near Denver...";

                    input.autocomplete =
                        "off";


                    var resultsContainer =
                        L.DomUtil.create(
                            "div",
                            "address-search-results",
                            container
                        );


                    L.DomEvent.disableClickPropagation(
                        container
                    );

                    L.DomEvent.disableScrollPropagation(
                        container
                    );


                    // ====================================================
                    // INPUT EVENT
                    // ====================================================

                    input.addEventListener(
                        "input",
                        function () {

                            var searchText =
                                input.value.trim();


                            clearTimeout(
                                addressSearchTimeout
                            );


                            if (
                                searchText.length < 3
                            ) {

                                resultsContainer.innerHTML =
                                    "";

                                resultsContainer.style.display =
                                    "none";

                                return;
                            }


                            addressSearchTimeout =
                                setTimeout(
                                    function () {

                                        searchGeoapify(
                                            searchText,
                                            resultsContainer,
                                            input
                                        );

                                    },
                                    250
                                );

                        }
                    );


                    // Hide suggestions when clicking outside
                    document.addEventListener(
                        "click",
                        function (event) {

                            if (
                                !container.contains(
                                    event.target
                                )
                            ) {

                                resultsContainer.style.display =
                                    "none";

                            }

                        }
                    );


                    return container;

                }

            });


        new AddressSearchControl()
            .addTo(map);


        // ============================================================
        // SEARCH GEOAPIFY
        // ============================================================

        function searchGeoapify(
            searchText,
            resultsContainer,
            input
        ) {

            // Cancel previous request if user keeps typing
            if (
                addressSearchController
            ) {

                addressSearchController.abort();

            }


            addressSearchController =
                new AbortController();


            resultsContainer.innerHTML =
                '<div class="address-search-status">' +
                'Searching...' +
                '</div>';

            resultsContainer.style.display =
                "block";


            var url =
                "https://api.geoapify.com/v1/geocode/autocomplete" +
                "?text=" +
                encodeURIComponent(
                    searchText
                ) +

                "&format=json" +

                "&limit=6" +

                "&filter=" +
                encodeURIComponent(
                    "rect:-105.35,39.45,-104.55,40.10"
                ) +

                "&bias=" +
                encodeURIComponent(
                    "proximity:-104.9903,39.7392"
                ) +

                "&lang=en" +

                "&apiKey=" +
                encodeURIComponent(
                    geoapifyApiKey
                );


            fetch(
                url,
                {
                    signal:
                        addressSearchController.signal
                }
            )

                .then(function (response) {

                    if (!response.ok) {

                        throw new Error(
                            "Geoapify request failed."
                        );

                    }


                    return response.json();

                })


                .then(function (results) {

                    displayAddressResults(
                        results,
                        resultsContainer,
                        input
                    );

                })


                .catch(function (error) {

                    if (
                        error.name ===
                        "AbortError"
                    ) {

                        return;

                    }


                    console.error(
                        "Address search error:",
                        error
                    );


                    resultsContainer.innerHTML =
                        '<div class="address-search-status">' +
                        'Unable to load address results.' +
                        '</div>';

                });

        }


        // ============================================================
        // DISPLAY ADDRESS RESULTS
        // ============================================================

        function displayAddressResults(
            results,
            resultsContainer,
            input
        ) {

            resultsContainer.innerHTML =
                "";


            if (
                !results ||
                results.length === 0
            ) {

                resultsContainer.innerHTML =
                    '<div class="address-search-status">' +
                    'No nearby addresses found.' +
                    '</div>';

                resultsContainer.style.display =
                    "block";

                return;

            }


            results.forEach(
                function (result) {

                    var latitude =
                        Number(
                            result.lat
                        );

                    var longitude =
                        Number(
                            result.lon
                        );


                    if (
                        isNaN(latitude) ||
                        isNaN(longitude)
                    ) {

                        return;

                    }


                    var resultItem =
                        L.DomUtil.create(
                            "div",
                            "address-search-result",
                            resultsContainer
                        );


                    resultItem.textContent =
                        result.formatted;


                    resultItem.addEventListener(
                        "click",
                        function () {

                            selectAddressResult(
                                result,
                                latitude,
                                longitude,
                                input,
                                resultsContainer
                            );

                        }
                    );

                }
            );


            resultsContainer.style.display =
                "block";

        }


        // ============================================================
        // SELECT ADDRESS
        // ============================================================

        function selectAddressResult(
            result,
            latitude,
            longitude,
            input,
            resultsContainer
        ) {

            var location =
                L.latLng(
                    latitude,
                    longitude
                );


            if (
                !denverMetroBounds.contains(
                    location
                )
            ) {

                alert(
                    "Please select an address in or near the Denver metro area."
                );

                return;

            }


            input.value =
                result.formatted;


            resultsContainer.style.display =
                "none";


            if (
                addressSearchMarker
            ) {

                map.removeLayer(
                    addressSearchMarker
                );

            }


            addressSearchMarker =
                L.marker(
                    location,
                    {
                        pane:
                            "pointPane"
                    }
                )
                    .addTo(map)
                    .bindPopup(
                        "<strong>Search Result</strong><br>" +
                        escapeAddressText(
                            result.formatted
                        )
                    )
                    .openPopup();


            map.setView(
                location,
                16
            );

        }


        // ============================================================
        // ESCAPE SEARCH RESULT TEXT
        // ============================================================

        function escapeAddressText(
            value
        ) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ============================================================
        // CREATE MAP PANES
        // Higher zIndex = displayed above lower zIndex
        // ============================================================

        map.createPane('censusPane');
        map.createPane('neighborhoodPane');
        map.createPane('boundaryPane');
        map.createPane('highlightPane');
        map.createPane('pointPane');
        map.createPane('labelPane');
        map.createPane('popupTopPane');
        map.createPane('protectivePolygonPane');
        map.createPane('topSchoolPane');

        map.getPane('labelPane').style.zIndex = 900;
        map.getPane('protectivePolygonPane').style.zIndex = 600;
        map.getPane('labelPane').style.pointerEvents = 'none';
        map.getPane('censusPane').style.zIndex = 300;
        map.getPane('neighborhoodPane').style.zIndex = 500;
        map.getPane('highlightPane').style.zIndex = 400;
        map.getPane('boundaryPane').style.zIndex = 700;
        map.getPane('pointPane').style.zIndex = 800;
        map.getPane('popupTopPane').style.zIndex = 1200;
        map.getPane('topSchoolPane').style.zIndex = 1000;

        console.log(
            "Census z-index:",
            map.getPane('censusPane').style.zIndex
        );

        console.log(
            "Neighborhood z-index:",
            map.getPane('neighborhoodPane').style.zIndex
        );

        console.log(
            "Highlight z-index:",
            map.getPane('highlightPane').style.zIndex
        );

        console.log(
            "Boundary z-index:",
            map.getPane('boundaryPane').style.zIndex
        );

        console.log(
            "Point z-index:",
            map.getPane('pointPane').style.zIndex
        );
        // ============================================================
        // POPUP FUNCTION
        // ============================================================

        function createPopup(feature) {

            var properties = feature.properties;

            if (!properties) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";

            for (var key in properties) {

                if (
                    properties[key] !== null &&
                    properties[key] !== undefined &&
                    properties[key] !== ""
                ) {

                    popupContent +=
                        "<strong>" +
                        key +
                        ":</strong> " +
                        properties[key] +
                        "<br>";
                }
            }

            popupContent += "</div>";

            return popupContent;
        }
        // ============================================================
        // CENSUS TRACT POPUP FUNCTION
        // Shows only relevant, user-friendly Census Tract information
        // ============================================================

        function createCensusPopup(feature) {

            var p = feature.properties;

            if (!p) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";

            // --------------------------------------------------------
            // BASIC INFORMATION
            // --------------------------------------------------------

            var censusTractName =
                p.tract_name ||
                p.NAME;

            if (
                censusTractName !== null &&
                censusTractName !== undefined &&
                censusTractName !== ""
            ) {
                popupContent +=
                    "<strong>Census Tract:</strong> " +
                    censusTractName +
                    "<br>";
            }

            if (p.SVI !== null && p.SVI !== undefined) {
                popupContent +=
                    "<strong>Social Vulnerability Score:</strong> " +
                    Number(p.SVI).toFixed(3) +
                    "<br>";
            }

            if (p.E_TOTPOP !== null && p.E_TOTPOP !== undefined) {
                popupContent +=
                    "<strong>Population:</strong> " +
                    Number(p.E_TOTPOP).toLocaleString() +
                    "<br>";
            }


            // --------------------------------------------------------
            // SOCIOECONOMIC CHARACTERISTICS
            // --------------------------------------------------------

            if (p.EP_POV150 !== null && p.EP_POV150 !== undefined) {
                popupContent +=
                    "<strong>Below 150% of Poverty Level:</strong> " +
                    Number(p.EP_POV150).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_UNEMP !== null && p.EP_UNEMP !== undefined) {
                popupContent +=
                    "<strong>Unemployment:</strong> " +
                    Number(p.EP_UNEMP).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_HBURD !== null && p.EP_HBURD !== undefined) {
                popupContent +=
                    "<strong>Housing Cost Burden:</strong> " +
                    Number(p.EP_HBURD).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_NOHSDP !== null && p.EP_NOHSDP !== undefined) {
                popupContent +=
                    "<strong>Without High School Diploma:</strong> " +
                    Number(p.EP_NOHSDP).toFixed(1) +
                    "%<br>";

            if (
                value === null ||
                value === undefined ||

            if (value > 0.4) return "#F57A00";

                // ========================================================

                function addHoverResponse(layerGroup) {

                    if (!layerGroup) {
                        return;
                    }


                    layerGroup.eachLayer(function (layer) {

                        // ====================================================
                        // CIRCLE MARKERS / VECTOR POINTS
                        // ====================================================

                        if (
                            typeof layer.setRadius === "function" &&
                            typeof layer.getRadius === "function"
                        ) {

                            var originalRadius =
                                layer.getRadius();


                            layer.on(
                                'mouseover',
                                function () {

                                    this.setRadius(
                                        originalRadius + 2
                                    );

                                    this.setStyle({
                                        weight: 2
                                    });

                                    if (this.bringToFront) {
                                        this.bringToFront();
                                    }

                                }
                            );


                            layer.on(
                                'mouseout',
                                function () {

                                    this.setRadius(
                                        originalRadius
                                    );

                                    this.setStyle({
                                        weight: 1
                                    });

                                }
                            );

                            return;
                        }


                        // ====================================================
                        // POLYGON / PATH FEATURES
                        // ====================================================

                        if (
                            typeof layer.setStyle === "function" &&
                            layer.options
                        ) {

                            var originalWeight =
                                layer.options.weight;

                            var originalFillOpacity =
                                layer.options.fillOpacity;


                            layer.on(
                                'mouseover',
                                function () {

                                    this.setStyle({

                                        weight:
                                            Math.max(
                                                Number(originalWeight) || 1,
                                                1
                                            ) + 2,

                                        fillOpacity:
                                            originalFillOpacity !== undefined
                                                ? Math.min(
                                                    Number(originalFillOpacity),
                                                    1
                                                )
                                                : undefined

                                    });


                                    if (this.bringToFront) {
                                        this.bringToFront();
                                    }

                                }
                            );


                            layer.on(
                                'mouseout',

                // ========================================================
                // DYNAMIC NEIGHBORHOOD LABEL PLACEMENT
                // ========================================================


                // --------------------------------------------------------
                // POINT-IN-RING TEST
                //
                // Used to determine whether a proposed label position
                // is actually inside the neighborhood polygon.
                // --------------------------------------------------------

                function pointInRing(point, ring) {

                    var x = point.lng;
                    var y = point.lat;

                    var inside = false;

                    for (
                        var i = 0, j = ring.length - 1;
                        i < ring.length;
                        j = i++
                    ) {

                        var xi = ring[i][0];
                        var yi = ring[i][1];

                        var xj = ring[j][0];
                        var yj = ring[j][1];


                        var intersects =
                            ((yi > y) !== (yj > y)) &&
                            (
                                x <
                                (xj - xi) *
                                (y - yi) /
                                ((yj - yi) || 0.0000001) +
                                xi
                            );


                        if (intersects) {
                            inside = !inside;
                        }

                    }

                    return inside;
                }


                // --------------------------------------------------------
                // CHECK ONE POLYGON
                //
                // GeoJSON polygons may contain:
                //
                // ring 0 = exterior boundary
                // ring 1+ = holes
                // --------------------------------------------------------

                function pointInPolygonCoordinates(
                    point,
                    polygonCoordinates
                ) {

                    if (
                        !polygonCoordinates ||
                        polygonCoordinates.length === 0
                    ) {
                        return false;
                    }


                    // Must be inside exterior ring

                    if (
                        !pointInRing(
                            point,
                            polygonCoordinates[0]
                        )
                    ) {

                        return false;

                    }


                    // Must NOT be inside a hole

                    for (
                        var i = 1;
                        i < polygonCoordinates.length;
                        i++
                    ) {

                        if (
                            pointInRing(
                                point,
                                polygonCoordinates[i]
                            )
                        ) {

                            return false;

                        }

                    }


                    return true;
                }


                // --------------------------------------------------------
                // CHECK WHETHER A LABEL BOX FITS INSIDE ITS NEIGHBORHOOD
                //
                // We test:
                // center
                // four corners
                // four edge midpoints
                //
                // This makes it much harder for text to cross a
                // neighborhood boundary.
                // --------------------------------------------------------

                function labelFitsInsideNeighborhood(
                    box,
                    feature
                ) {

                    if (
                        !feature ||
                        !feature.geometry
                    ) {

                        return true;

                    }


                    var geometry =
                        feature.geometry;


                    // Screen positions to test

                    var screenPoints = [

                        // Center
                        L.point(
                            (box.left + box.right) / 2,
                            (box.top + box.bottom) / 2
                        ),

                        // Corners
                        L.point(
                            box.left,
                            box.top
                        ),

                        L.point(
                            box.right,
                            box.top
                        ),

                        L.point(
                            box.left,
                            box.bottom
                        ),

                        L.point(
                            box.right,
                            box.bottom
                        ),

                        // Top midpoint
                        L.point(
                            (box.left + box.right) / 2,
                            box.top
                        ),

                        // Bottom midpoint
                        L.point(
                            (box.left + box.right) / 2,
                            box.bottom
                        ),

                        // Left midpoint
                        L.point(
                            box.left,
                            (box.top + box.bottom) / 2
                        ),

                        // Right midpoint
                        L.point(
                            box.right,
                            (box.top + box.bottom) / 2
                        )

                    ];


                    // Convert screen coordinates back to geographic coordinates

                    var geographicPoints =
                        screenPoints.map(function (point) {

                            return map.containerPointToLatLng(
                                point
                            );

                        });


                    // ====================================================
                    // NORMAL POLYGON
                    // ====================================================

                    if (
                        geometry.type === "Polygon"
                    ) {

                        return geographicPoints.every(
                            function (point) {

                                return pointInPolygonCoordinates(
                                    point,
                                    geometry.coordinates
                                );

                            }
                        );

                    }


                    // ====================================================
                    // MULTIPOLYGON
                    //
                    // All sample points must fit inside the SAME polygon
                    // component.
                    // ====================================================

                    if (
                        geometry.type === "MultiPolygon"
                    ) {

                        return geometry.coordinates.some(
                            function (polygonCoordinates) {

                                return geographicPoints.every(
                                    function (point) {

                                        return pointInPolygonCoordinates(
                                            point,
                                            polygonCoordinates
                                        );

                                    }
                                );

                            }
                        );

                    }


                    return true;
                }

                // ========================================================
                // CREATE POSSIBLE MULTI-LINE LABEL FORMATS
                // ========================================================

                function createLabelLayouts(text) {

                    var words =
                        text
                            .trim()
                            .split(/\s+/);


                    var layouts = [];


                    // ----------------------------------------------------
                    // OPTION 1:
                    // Entire neighborhood name on one line
                    // ----------------------------------------------------

                    layouts.push(
                        text
                    );


                    // ----------------------------------------------------
                    // OPTION 2:
                    // If there are multiple words,
                    // split roughly in half
                    // ----------------------------------------------------

                    if (words.length >= 2) {

                        var middle =
                            Math.ceil(
                                words.length / 2
                            );


                        var firstHalf =
                            words
                                .slice(0, middle)
                                .join(" ");


                        var secondHalf =
                            words
                                .slice(middle)
                                .join(" ");


                        if (secondHalf) {

                            layouts.push(
                                firstHalf +
                                "<br>" +
                                secondHalf
                            );

                        }

                    }


                    // ----------------------------------------------------
                    // OPTION 3:
                    // For 3+ words, try approximately three lines
                    // ----------------------------------------------------

                    if (words.length >= 3) {

                        var lines = [];

                        var wordsPerLine =
                            Math.ceil(
                                words.length / 3
                            );


                        for (
                            var i = 0;
                            i < words.length;
                            i += wordsPerLine
                        ) {

                            lines.push(
                                words
                                    .slice(
                                        i,
                                        i + wordsPerLine
                                    )
                                    .join(" ")
                            );

                        }


                        layouts.push(
                            lines.join("<br>")
                        );

                    }


                    // ----------------------------------------------------
                    // OPTION 4:
                    // One word per line
                    //
                    // Most compact horizontally
                    // ----------------------------------------------------

                    if (words.length >= 2) {

                        layouts.push(
                            words.join("<br>")
                        );

                    }


                    return layouts;
                }

                // ========================================================
                // UPDATE NEIGHBORHOOD LABELS
                // ========================================================

                function updateNeighborhoodLabels() {

                    var zoom =
                        map.getZoom();


                    // ====================================================
                    // HIDE LABELS WHEN ZOOMED OUT

                    // ====================================================
                    // COLLECT POINT FEATURES
                    //
                    // Neighborhood labels will try to avoid these.
                    // ====================================================

                    var obstaclePoints = [];


                    function collectPointObstacles(

                        if (
                            !layerGroup ||

                        layerGroup.eachLayer(

                        );

                    }


                    collectPointObstacles(

                    collectPointObstacles(

                    collectPointObstacles(

                    );

                    collectPointObstacles(

                    );

                    collectPointObstacles(
                        sudFacilities
                    );
                    collectPointObstacles(
                        farmersMarkets
                    );
                    collectPointObstacles(
                        swimmingPools
                    );

                    collectPointObstacles(
                        libraries
                    );

                    collectPointObstacles(
                        skateparks
                    );
                    collectPointObstacles(
                        libraries
                    );

                    collectPointObstacles(
                        skateparks
                    );

                    collectPointObstacles(
                        youthDevelopment
                    );

                    collectPointObstacles(
                        sportsFitness
                    );

                    collectPointObstacles(
                        artsMusic
                    );

                    collectPointObstacles(
                        academicStem
                    );

                    collectPointObstacles(
                        mentalHealthWellness
                    );

                    collectPointObstacles(
                        communityServices
                    );

                    collectPointObstacles(
                        earlyChildhood
                    );

                    collectPointObstacles(
                        amphitheaters
                    );

                    collectPointObstacles(
                        healthFacilities
                    );
                    collectPointObstacles(
                        basketballCourts
                    );

                    collectPointObstacles(
                        tennisRacquetCourts
                    );

                    collectPointObstacles(
                        pickleballCourts
                    );

                    collectPointObstacles(
                        otherCourts
                    );

                    collectPointObstacles(
                        healthFacilities
                    );

                    collectPointObstacles(
                        hospitals
                    );

                    collectPointObstacles(
                        federallyQualifiedHealthCenters
                    );
                    collectPointObstacles(
                        privateRecreationCenters
                    );

                    collectPointObstacles(
                        artCulturalCenters
                    );

                    collectPointObstacles(
                        schoolBasedHealthCenters
                    );

                    collectPointObstacles(
                        groceryStores
                    );

                    collectPointObstacles(
                        foodAssistance
                    );


                    // ====================================================
                    // TRACK LABELS ALREADY PLACED
                    // ====================================================

                    var occupiedBoxes = [];



                    // ====================================================
                    // TRACK LABELS ALREADY PLACED
                    // ====================================================

                    var occupiedBoxes = [];



                    // ====================================================
                    // BASE FONT SIZE
                    //
                    // Automatically increases as user zooms in.
                    // ====================================================

                    var preferredFontSize =
                        Math.min(
                            16,
                            9 + ((zoom - 13) * 1.5)
                        );



                    // ====================================================
                    // PROCESS EVERY NEIGHBORHOOD
                    // ====================================================

                    neighborhoods.eachLayer(
                        function (layer) {

                            var tooltip =
                                layer.getTooltip();


                            if (!tooltip) {
                                return;
                            }


                            layer.openTooltip();


                            var tooltipElement =
                                tooltip.getElement();
                            // =================================================
                            // ORIGINAL NEIGHBORHOOD NAME
                            // =================================================

                            var neighborhoodName =
                                layer.feature &&
                                    layer.feature.properties
                                    ? layer.feature.properties.NBHD_NAME
                                    : "";


                            var labelLayouts =
                                createLabelLayouts(
                                    neighborhoodName
                                );

                            if (!tooltipElement) {
                                return;
                            }


                            // Hide while calculating

                            tooltip.setOpacity(0);



                            // =================================================
                            // GET NEIGHBORHOOD CENTER
                            // =================================================

                            if (
                                !layer.getBounds
                            ) {

                                return;

                            }


                            var center =
                                layer
                                    .getBounds()
                                    .getCenter();


                            var centerPoint =
                                map.latLngToContainerPoint(
                                    center
                                );



                            // =================================================
                            // POSSIBLE LABEL POSITIONS
                            //
                            // Starts close to center and gradually expands.
                            // =================================================

                            var offsets = [

                                // Center
                                [0, 0],

                                // Slight movement
                                [0, -12],
                                [0, 12],
                                [-18, 0],
                                [18, 0],

                                // Diagonals
                                [-18, -12],
                                [18, -12],
                                [-18, 12],
                                [18, 12],

                                // Greater movement
                                [0, -25],
                                [0, 25],
                                [-35, 0],
                                [35, 0],

                                // Greater diagonals
                                [-30, -20],
                                [30, -20],
                                [-30, 20],
                                [30, 20],

                                // Even farther
                                [0, -40],
                                [0, 40],
                                [-50, 0],
                                [50, 0]

                            ];



                            var placed = false;

                            var fontSize =
                                preferredFontSize;



                            // =================================================
                            // TRY DIFFERENT FONT SIZES
                            // =================================================

                            while (
                                fontSize >= 5 &&
                                !placed
                            ) {

                                tooltipElement.style.fontSize =
                                    fontSize + "px";


                                // =================================================
                                // TRY EACH TEXT LAYOUT
                                //
                                // 1 line
                                // 2 lines
                                // 3 lines
                                // one word per line
                                // =================================================

                                for (
                                    var layoutIndex = 0;
                                    layoutIndex < labelLayouts.length;
                                    layoutIndex++
                                ) {

                                    var currentLayout =
                                        labelLayouts[
                                        layoutIndex
                                        ];


                                    // Apply this version of the label

                                    tooltipElement.innerHTML =
                                        "<strong>" +
                                        currentLayout +
                                        "</strong>";


                                    // Always force bold styling

                                    tooltipElement.style.fontWeight =
                                        "900";


                                    tooltipElement.style.textAlign =
                                        "center";


                                    tooltipElement.style.lineHeight =
                                        "1.05";


                                    // Force browser to calculate actual dimensions

                                    var width =
                                        tooltipElement.offsetWidth;


                                    var height =
                                        tooltipElement.offsetHeight;



                                    // =================================================
                                    // TRY EACH POSSIBLE POSITION
                                    // =================================================

                                    for (
                                        var i = 0;
                                        i < offsets.length;
                                        i++
                                    ) {

                                        var offsetX =
                                            offsets[i][0];


                                        var offsetY =
                                            offsets[i][1];


                                        var x =
                                            centerPoint.x +
                                            offsetX;


                                        var y =
                                            centerPoint.y +
                                            offsetY;



                                        // =============================================
                                        // BUILD LABEL BOUNDING BOX
                                        // =============================================

                                        var box = {

                                            left:
                                                x -
                                                width / 2,

                                            right:
                                                x +
                                                width / 2,

                                            top:
                                                y -
                                                height / 2,

                                            bottom:
                                                y +
                                                height / 2

                                        };


                                        var collision =
                                            false;



                                        // =============================================
                                        // CONDITION 1:
                                        // LABEL MUST FIT INSIDE NEIGHBORHOOD
                                        // =============================================

                                        if (
                                            !labelFitsInsideNeighborhood(
                                                box,
                                                layer.feature
                                            )
                                        ) {

                                            continue;

                                        }



                                        // =============================================
                                        // CONDITION 2:
                                        // AVOID POINT FEATURES
                                        // =============================================

                                        var pointPadding =
                                            10;


                                        for (
                                            var p = 0;
                                            p < obstaclePoints.length;
                                            p++
                                        ) {

                                            var obstacle =
                                                obstaclePoints[p];


                                            if (
                                                obstacle.x >
                                                box.left -
                                                pointPadding &&

                                                obstacle.x <
                                                box.right +
                                                pointPadding &&

                                                obstacle.y >
                                                box.top -
                                                pointPadding &&

                                                obstacle.y <
                                                box.bottom +
                                                pointPadding
                                            ) {

                                                collision =
                                                    true;

                                                break;

                                            }

                                        }


                                        if (collision) {

                                            continue;

                                        }



                                        // =============================================
                                        // CONDITION 3:
                                        // AVOID OTHER LABELS
                                        // =============================================

                                        var labelPadding =
                                            4;


                                        for (
                                            var b = 0;
                                            b < occupiedBoxes.length;
                                            b++
                                        ) {

                                            var other =
                                                occupiedBoxes[b];


                                            var overlaps =
                                                !(
                                                    box.right +
                                                    labelPadding <
                                                    other.left ||

                                                    box.left -
                                                    labelPadding >
                                                    other.right ||

                                                    box.bottom +
                                                    labelPadding <
                                                    other.top ||

                                                    box.top -
                                                    labelPadding >
                                                    other.bottom
                                                );


                                            if (overlaps) {

                                                collision =
                                                    true;

                                                break;

                                            }

                                        }


                                        if (collision) {

                                            continue;

                                        }



                                        // =============================================
                                        // VALID POSITION FOUND
                                        // =============================================

                                        var newPoint =
                                            L.point(
                                                x,
                                                y
                                            );


                                        var newLatLng =
                                            map.containerPointToLatLng(
                                                newPoint
                                            );


                                        tooltip.setLatLng(
                                            newLatLng
                                        );


                                        tooltip.setOpacity(
                                            1
                                        );


                                        occupiedBoxes.push(
                                            box
                                        );


                                        placed =
                                            true;


                                        break;

                                    }


                                    // Stop trying alternate layouts
                                    // once we found a valid solution

                                    if (placed) {

                                        break;

                                    }

                                }



                                // =================================================
                                // NOTHING FIT?
                                //
                                // Reduce font size and try:
                                //
                                // one-line
                                // two-line
                                // three-line
                                // vertical
                                //
                                // all over again.
                                // =================================================

                                if (!placed) {

                                    fontSize -= 1;

                                }

                            }



                            // =====================================================
                            // FALLBACK
                            //
                            // No collision-free placement was possible.
                            //
                            // Still ALWAYS show the neighborhood name.
                            //
                            // Use the most compact multi-line version and
                            // ALWAYS keep it bold.
                            // =====================================================

                            if (!placed) {

                                var fallbackFontSize =
                                    Math.max(
                                        7,
                                        Math.min(
                                            preferredFontSize,
                                            10
                                        )
                                    );


                                tooltipElement.style.fontSize =
                                    fallbackFontSize +
                                    "px";


                                tooltipElement.style.fontWeight =
                                    "900";


                                tooltipElement.style.textAlign =
                                    "center";


                                tooltipElement.style.lineHeight =
                                    "1.05";


                                // Use the narrowest available layout
                                // for the fallback.

                                tooltipElement.innerHTML =
                                    "<strong>" +
                                    labelLayouts[
                                    labelLayouts.length - 1
                                    ] +
                                    "</strong>";

                                tooltip.setLatLng(
                                    center
                                );


                                tooltip.setOpacity(
                                    1
                                );

                            }
                            // ========================================================
                            // CLOSE neighborhoods.eachLayer()
                            // ========================================================

                        }
                    );


                    // ========================================================
                    // CLOSE updateNeighborhoodLabels()
                    // ========================================================

                }
                // ========================================================
                // RECALCULATE LABELS WHEN MAP CHANGES

                map.on(

                // ========================================================
                // SCHOOLS
                // Colored by School Risk Index
                // ========================================================

                var schools = L.geoJSON(
                    schoolsData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,

                        ) {

                            return L.circleMarker(
                                latlng,
                                {
                                    pane: 'pointPane',

                                    ),

                                    color: "#000000",

                        onEachFeature: function (

                    }
                );
                // ========================================================
                // CHECK WHETHER SCHOOL IS IN-PERSON
                // Online schools are excluded from Top 5 rankings.
                // ========================================================

                function isInPersonSchool(feature) {

                    var name =
                        (
                            feature.properties.school_name ||
                            ""
                        )
                            .toLowerCase()
                            .trim();


                    // Exclude any school whose name contains "online"
                    return !name.includes("online");
                }

                // --------------------------------------------------------
                // TOP 5 TRADITIONAL SCHOOLS
                // --------------------------------------------------------

                var traditionalFeatures =
                    schoolsData.features
                        .filter(function (feature) {

                            return (
                                feature.properties.school_type ===
                                "Traditional" &&
                                isInPersonSchool(feature)
                            );

                        })
                        .sort(function (a, b) {

                            return (
                                Number(b.properties.SRI_score) -

                            );

                        .slice(0, 5);


                // --------------------------------------------------------
                // TOP 5 ALTERNATIVE / PATHWAY SCHOOLS
                // --------------------------------------------------------

                var alternativeFeatures =
                    schoolsData.features
                        .filter(function (feature) {

                            return (
                                feature.properties.school_type ===

                                isInPersonSchool(feature)

                        .sort(function (a, b) {

                            return (
                                Number(b.properties.SRI_score) -

                    var gap = 4;


                    // ====================================================

                    // ====================================================

                    var layerToggle =
                        document.querySelector(
                            '.layer-toggle-fixed'
                        );


                    if (
                        layerToggle &&
                        layerControlContainer
                    ) {

                        var toggleHeight =
                            layerToggle.offsetHeight;


                        // Keep enough space above the layer control
                        layerControlContainer.style.marginTop =
                            (
                                toggleHeight +
                                gap +
                                10
                            ) +
                            'px';


                        var layerBox =
                            layerControlContainer
                                .getBoundingClientRect();


                        layerToggle.style.top =
                            (
                                layerBox.top -
                                toggleHeight -
                                10
                            ) +
                            'px';


                        layerToggle.style.left =
                            layerBox.left + 'px';


                        layerToggle.style.right =
                            'auto';

                    }


                    // ====================================================
                    // LEGEND TOGGLE
                    // ====================================================

                    var legendToggle =
                        document.querySelector(
                            '.legend-toggle-fixed'
                        );


                    var legendContainer =
                        legend.getContainer();


                    if (
                        legendToggle &&
                        legendContainer
                    ) {

                        var legendBox =
                            legendContainer
                                .getBoundingClientRect();


                        var legendToggleHeight =
                            legendToggle.offsetHeight;


                        legendToggle.style.top =
                            (
                                legendBox.top -
                                legendToggleHeight -
                                gap
                            ) +
                            'px';


                        legendToggle.style.right =
                            (
                                window.innerWidth -
                                legendBox.right
                            ) +
                            'px';


                        legendToggle.style.left =
                            'auto';

                    }

                }
