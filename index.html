<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Denver Social Vulnerability Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map {
            height: 600px;
        }
    </style>
</head>

<body>

    <h1>Denver Social Vulnerability Map</h1>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>

        // Create the map
        var map = L.map('map').setView([39.7392, -104.9903], 10);

        // Add a basemap
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);
        // Alternative Schools
        fetch('Data/Alternative_Schools.geojson')
            .then(response => response.json())
            .then(data => {

                var alternativeSchools = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: "#800080",
                            color: "#FFFFFF",
                            weight: 1,
                            fillOpacity: 1
                        });
                    }
                })
                alternativeSchools.addTo(map);

            });
        // Traditional Schools
        fetch('Data/Traditional_Schools.geojson')
            .then(response => response.json())
            .then(data => {

                var traditionalSchools = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: "#008000",
                            color: "#FFFFFF",
                            weight: 1,
                            fillOpacity: 1
                        });
                    }
                })
                traditionalSchools.addTo(map);

            });
        // Schools
        fetch('Data/Schools.geojson')
            .then(response => response.json())
            .then(data => {

                var schools = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: "#0000FF",
                            color: "#FFFFFF",
                            weight: 1,
                            fillOpacity: 1
                        });
                    }
                })
                schools.addTo(map);

            });
        // County Boundary
        fetch('Data/County_Boundary.geojson')
            .then(response => response.json())
            .then(data => {
                var countyBoundary = L.geoJSON(data, {
                    style: {
                        color: "#000000",
                        weight: 3,
                        fill: false
                    }
                });
                countyBoundary.addTo(map);
            });
        // Recreation Centers
        fetch('Data/Recreation%20Centers.geojson')
            .then(response => response.json())
            .then(data => {

                var reacreationCenters = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: "#FFA500",
                            color: "#FFFFFF",
                            weight: 1,
                            fillOpacity: 1
                        });
                    }
                })
                recreationCenters.addTo(map);

            });
        // SUD Facilities
        fetch('Data/SUD_Facilities.geojson')
            .then(response => response.json())
            .then(data => {

                var sudFacitilities = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: "#FF00FF",
                            color: "#FFFFFF",
                            weight: 1,
                            fillOpacity: 1
                        });
                    }
                })
                sudFacilities.addTo(map);

            });

        // Neighborhoods
        fetch('Data/Neighborhoods.geojson')
            .then(response => response.json())
            .then(data => {
                var neighborhoods = L.geoJSON(data, {
                    style: {
                        color: "#555555",
                        weight: 1,
                        fill: false
                    }
                })
                neighborhoods.addTo(map);
            });

        // Five Highest Census Tracts
        fetch('Data/Five_Highest_Census_Tracts.geojson')
            .then(response => response.json())
            .then(data => {

                var fiveHighestCensusTracts = L.geoJSON(data, {
                    style: {
                        color: "#000000",
                        weight: 3,
                        fillColor: "#FF0000",
                        fillOpacity: 0.25
                    }
                })
                fiveHighestCensusTracts.addTo(map);

            });
        // Load census tracts
        fetch('Data/Census_Tracts.geojson')
            .then(response => {
                console.log("Response:", response);
                return response.json();
            })
            .then(data => {

                console.log("GeoJSON loaded:", data);
                console.log("Number of features:", data.features.length);


                function getColor(value) {
                    if (value > 0.8) return "#F50000";
                    if (value > 0.6) return "#F53D00";
                    if (value > 0.4) return "#F57A00";
                    if (value > 0.2) return "#F5B800";
                    return "#F5F500";
                }

                function style(feature) {
                    return {
                        fillColor: getColor(feature.properties.SVI),
                        weight: 1,
                        opacity: 1,
                        color: "#000000",
                        fillOpacity: 1
                    };
                }

                var censusTracts = L.geoJSON(data, {
                    style: style
                }).addTo(map);

                map.fitBounds(censusTracts.getBounds());

            })
            .catch(error => {
                console.error("GeoJSON error:", error);
            });



    </script>

</body>

</html>
