<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Denver Social Vulnerability Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map {
            height: 600px;
        }

        /* ============================================================
           LEGEND
           ============================================================ */

        .info.legend {
            padding: 10px 12px;
            background: white;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            line-height: 22px;
            color: #333;
            max-height: 550px;
            overflow-y: auto;
        }

        .info.legend h4 {
            margin: 0 0 6px 0;
            font-size: 15px;
        }

        .info.legend .legend-section {
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        /* Square symbols */

        .info.legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 1;
        }

        /* Circle symbols */

        .info.legend .circle-symbol {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin: 3px 8px 0 3px;
        }

        /* Line symbols */

        .info.legend .line-symbol {
            width: 20px;
            height: 0;
            margin-top: 10px;
            border-top: 3px solid;
            background: none;
        }

        /* Polygon symbol */

        .info.legend .polygon-symbol {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }
    </style>
</head>


<body>

    <h1>Denver Social Vulnerability Map</h1>

    <div id="map"></div>


    <!-- Leaflet JavaScript -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        // ============================================================
        // CREATE MAP
        // ============================================================

        var map = L.map('map').setView(
            [39.7392, -104.9903],
            10
        );


        // ============================================================
        // BASEMAP
        // ============================================================

        var osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // ============================================================
        // CREATE MAP PANES
        // Higher zIndex = displayed above lower zIndex
        // ============================================================

        map.createPane('censusPane');
        map.createPane('neighborhoodPane');
        map.createPane('boundaryPane');
        map.createPane('highlightPane');
        map.createPane('pointPane');

        map.getPane('censusPane').style.zIndex = 300;
        map.getPane('neighborhoodPane').style.zIndex = 400;
        map.getPane('highlightPane').style.zIndex = 650;
        map.getPane('boundaryPane').style.zIndex = 700;
        map.getPane('pointPane').style.zIndex = 800;


        // ============================================================
        // POPUP FUNCTION
        // ============================================================

        function createPopup(feature) {

            var properties = feature.properties;

            if (!properties) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";

            for (var key in properties) {

                if (
                    properties[key] !== null &&
                    properties[key] !== undefined &&
                    properties[key] !== ""
                ) {

                    popupContent +=
                        "<strong>" +
                        key +
                        ":</strong> " +
                        properties[key] +
                        "<br>";
                }
            }

            popupContent += "</div>";

            return popupContent;
        }


        // ============================================================
        // SVI COLOR FUNCTION
        // ============================================================

        function getColor(value) {

            if (
                value === null ||
                value === undefined ||
                isNaN(value)
            ) {
                return "#808080";
            }

            if (value > 0.8) return "#F50000";
            if (value > 0.6) return "#F53D00";
            if (value > 0.4) return "#F57A00";
            if (value > 0.2) return "#F5B800";

            return "#F5F500";
        }


        // ============================================================
        // SCHOOL SRI COLOR FUNCTION
        // ============================================================

        function getSchoolColor(value) {

            if (
                value === null ||
                value === undefined ||
                isNaN(value)
            ) {
                return "#808080";
            }

            if (value > 0.8) return "#F50000";
            if (value > 0.6) return "#F53D00";
            if (value > 0.4) return "#F57A00";
            if (value > 0.2) return "#F5B800";

            return "#F5F500";
        }


        // ============================================================
        // SVI CENSUS TRACT STYLE
        // ============================================================

        function censusStyle(feature) {

            return {

                fillColor: getColor(
                    feature.properties.SVI
                ),

                weight: 1,

                opacity: 1,

                color: "#000000",

                fillOpacity: 1
            };
        }


        // ============================================================
        // LOAD ALL DATA
        // ============================================================

        Promise.all([

            // --------------------------------------------------------
            // CENSUS TRACTS
            // --------------------------------------------------------

            fetch('Data/Census_Tracts.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Census_Tracts.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // COUNTY BOUNDARY
            // --------------------------------------------------------

            fetch('Data/County_Boundary.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load County_Boundary.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // NEIGHBORHOODS
            // --------------------------------------------------------

            fetch('Data/Neighborhoods.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Neighborhoods.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // SCHOOLS
            // --------------------------------------------------------

            fetch('Data/Schools.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Schools.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // TRADITIONAL SCHOOLS
            // --------------------------------------------------------

            fetch('Data/Traditional_Schools.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Traditional_Schools.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // ALTERNATIVE SCHOOLS
            // --------------------------------------------------------

            fetch('Data/Alternative_Schools.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Alternative_Schools.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // RECREATION CENTERS
            // --------------------------------------------------------

            fetch('Data/Recreation_Centers.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Recreation_Centers.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // SUD FACILITIES
            // --------------------------------------------------------

            fetch('Data/SUD_Facilities.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load SUD_Facilities.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                }),


            // --------------------------------------------------------
            // FIVE HIGHEST SVI CENSUS TRACTS
            // --------------------------------------------------------

            fetch('Data/Five_Highest_Census_Tracts.geojson')
                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Could not load Five_Highest_Census_Tracts.geojson: " +
                            response.status
                        );
                    }

                    return response.json();
                })

        ])


            // ============================================================
            // CREATE LEAFLET LAYERS
            // ============================================================

            .then(function (data) {

                console.log(
                    "All GeoJSON files loaded successfully."
                );


                // --------------------------------------------------------
                // STORE DATA
                // --------------------------------------------------------

                var censusData = data[0];
                var countyData = data[1];
                var neighborhoodData = data[2];
                var schoolsData = data[3];
                var traditionalSchoolsData = data[4];
                var alternativeSchoolsData = data[5];
                var recreationData = data[6];
                var sudData = data[7];
                var highestData = data[8];


                console.log(
                    "Census tract features:",
                    censusData.features.length
                );

                console.log(
                    "School features:",
                    schoolsData.features.length
                );


                // ========================================================
                // CENSUS TRACTS
                // ========================================================

                var censusTracts = L.geoJSON(
                    censusData,
                    {

                        pane: 'censusPane',

                        style: censusStyle,

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>Census Tract</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // COUNTY BOUNDARY
                // ========================================================

                var countyBoundary = L.geoJSON(
                    countyData,
                    {

                        pane: 'boundaryPane',

                        style: {

                            color: "#000000",

                            weight: 5,

                            opacity: 1,

                            fill: false

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>County Boundary</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // NEIGHBORHOODS
                // ========================================================

                var neighborhoods = L.geoJSON(
                    neighborhoodData,
                    {

                        pane: 'neighborhoodPane',

                        style: {

                            color: "#000000",

                            weight: 2,

                            opacity: 1,

                            fill: false

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>Neighborhood</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // SCHOOLS
                // Colored by SRI_SCORE
                // ========================================================

                var schools = L.geoJSON(
                    schoolsData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.circleMarker(
                                latlng,
                                {

                                    radius: 6,

                                    fillColor: getSchoolColor(
                                        feature.properties.SRI_SCORE
                                    ),

                                    color: "#000000",

                                    weight: 1,

                                    fillOpacity: 1

                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>School</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // TRADITIONAL SCHOOLS
                // ========================================================

                var traditionalSchools = L.geoJSON(
                    traditionalSchoolsData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.circleMarker(
                                latlng,
                                {

                                    radius: 6,

                                    fillColor: "#008000",

                                    color: "#FFFFFF",

                                    weight: 1,

                                    fillOpacity: 1

                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>Traditional School</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // ALTERNATIVE SCHOOLS
                // ========================================================

                var alternativeSchools = L.geoJSON(
                    alternativeSchoolsData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.circleMarker(
                                latlng,
                                {

                                    radius: 6,

                                    fillColor: "#800080",

                                    color: "#FFFFFF",

                                    weight: 1,

                                    fillOpacity: 1

                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>Alternative School</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // RECREATION CENTERS
                // ========================================================

                var recreationCenters = L.geoJSON(
                    recreationData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.circleMarker(
                                latlng,
                                {

                                    radius: 4,

                                    fillColor: "#4CE600",

                                    color: "#FFFFFF",

                                    weight: 1,

                                    fillOpacity: 1

                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>Recreation Center</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // SUD FACILITIES
                // ========================================================

                var sudFacilities = L.geoJSON(
                    sudData,
                    {

                        pane: 'pointPane',

                        pointToLayer: function (
                            feature,
                            latlng
                        ) {

                            return L.circleMarker(
                                latlng,
                                {

                                    radius: 4,

                                    fillColor: "#0070FF",

                                    color: "#FFFFFF",

                                    weight: 1,

                                    fillOpacity: 1

                                }
                            );

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>SUD Facility</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // FIVE HIGHEST SVI CENSUS TRACTS
                // ========================================================

                var fiveHighestCensusTracts = L.geoJSON(
                    highestData,
                    {

                        pane: 'highlightPane',

                        style: {

                            color: "#A80000",

                            weight: 3,

                            opacity: 1,

                            fillColor: "#A80000",

                            fillOpacity: 1

                        },

                        onEachFeature: function (
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                "<strong>Highest SVI Census Tract</strong><br><br>" +
                                createPopup(feature)
                            );

                        }

                    }
                );


                // ========================================================
                // ADD INITIAL LAYERS TO MAP
                // ========================================================

                censusTracts.addTo(map);

                countyBoundary.addTo(map);

                schools.addTo(map);

                traditionalSchools.addTo(map);

                alternativeSchools.addTo(map);

                fiveHighestCensusTracts.addTo(map);

                neighborhoods.addTo(map);

                // Recreation Centers and SUD Facilities
                // are available in the layer control but
                // are OFF by default.


                // ========================================================
                // FIT MAP TO CENSUS TRACTS
                // ========================================================

                if (censusTracts.getBounds().isValid()) {

                    map.fitBounds(
                        censusTracts.getBounds()
                    );

                }


                // ========================================================
                // LAYER CONTROL
                // ========================================================

                L.control.layers(

                    {
                        "OpenStreetMap": osm
                    },

                    {
                        "Census Tracts": censusTracts,
                        "County Boundary": countyBoundary,
                        "Neighborhoods": neighborhoods,
                        "Schools": schools,
                        "Traditional Schools": traditionalSchools,
                        "Alternative Schools": alternativeSchools,
                        "Recreation Centers": recreationCenters,
                        "SUD Facilities": sudFacilities,
                        "Five Highest SVI Tracts": fiveHighestCensusTracts
                    },

                    {
                        position: 'topleft',
                        collapsed: false
                    }

                ).addTo(map);


                // ========================================================
                // LEGEND
                // ========================================================

                var legend = L.control({
                    position: 'bottomright'
                });


                legend.onAdd = function (map) {

                    var div = L.DomUtil.create(
                        'div',
                        'info legend'
                    );


                    // ====================================================
                    // TITLE
                    // ====================================================

                    div.innerHTML +=
                        '<h4>Map Legend</h4>';


                    // ====================================================
                    // SVI / SRI COLOR SCALE
                    // LOW → HIGH
                    // ====================================================

                    div.innerHTML +=
                        '<div class="legend-section">' +
                        'Census Tracts - SVI Score' +
                        '</div>';


                    div.innerHTML +=
                        '<i style="background:#F5F500"></i>' +
                        'Low<br>';


                    div.innerHTML +=
                        '<i style="background:#F5B800"></i>' +
                        '>Low - Moderate<br>';


                    div.innerHTML +=
                        '<i style="background:#F57A00"></i>' +
                        '>Moderate<br>';


                    div.innerHTML +=
                        '<i style="background:#F53D00"></i>' +
                        '>Moderate - High<br>';


                    div.innerHTML +=
                        '<i style="background:#F50000"></i>' +
                        '>High<br>';

                    // ====================================================
                    // HIGHLIGHTED CENSUS TRACTS
                    // ====================================================

                    div.innerHTML +=
                        '<i style="' +
                        'background:#A80000;' +
                        'border:2px solid #A80000' +
                        '"></i>' +
                        'Five Highest SVI Tracts<br>';

                    // ====================================================
                    // SCHOOLS
                    // ====================================================

                    div.innerHTML +=
                        '<div class="legend-section">' +
                        'Schools — SRI Score' +
                        '</div>';


                    // Low SRI

                    div.innerHTML +=
                        '<i class="circle-symbol" ' +
                        'style="' +
                        'background:#F5F500;' +
                        'border:1px solid #000000' +
                        '"></i>' +
                        'Low<br>';


                    // Low - Moderate

                    div.innerHTML +=
                        '<i class="circle-symbol" ' +
                        'style="' +
                        'background:#F5B800;' +
                        'border:1px solid #000000' +
                        '"></i>' +
                        '>Low - Moderate<br>';


                    // Moderate

                    div.innerHTML +=
                        '<i class="circle-symbol" ' +
                        'style="' +
                        'background:#F57A00;' +
                        'border:1px solid #000000' +
                        '"></i>' +
                        '>Moderate<br>';


                    // Moderate - High

                    div.innerHTML +=
                        '<i class="circle-symbol" ' +
                        'style="' +
                        'background:#F53D00;' +
                        'border:1px solid #000000' +
                        '"></i>' +
                        '>Moderate - High<br>';


                    // High

                    div.innerHTML +=
                        '<i class="circle-symbol" ' +
                        'style="' +
                        'background:#F50000;' +
                        'border:1px solid #000000' +
                        '"></i>' +
                        '>High<br>';


                    // ====================================================
                    // SCHOOL TYPES
                    // ====================================================

                    div.innerHTML +=
                        '<div class="legend-section">' +
                        'School Types' +
                        '</div>';


                    div.innerHTML +=
                        '<i class="circle-symbol" ' +
                        'style="' +
                        'background:#008000;' +
                        'border:1px solid #FFFFFF' +
                        '"></i>' +
                        'Top 5 Traditional Schools<br>';


                    div.innerHTML +=
                        '<i class="circle-symbol" ' +
                        'style="' +
                        'background:#800080;' +
                        'border:1px solid #FFFFFF' +
                        '"></i>' +
                        'Top 5 Alternative Schools<br>';
                    // ====================================================
                    // BOUNDARIES
                    // ====================================================

                    div.innerHTML +=
                        '<div class="legend-section">' +
                        'Boundaries' +
                        '</div>';


                    div.innerHTML +=
                        '<i class="line-symbol" ' +
                        'style="border-color:#000000; ' +
                        'border-top-width:3px">' +
                        '</i>' +
                        'County Boundary<br>';


                    div.innerHTML +=
                        '<i class="line-symbol" ' +
                        'style="border-color:#555555; ' +
                        'border-top-width:1px">' +
                        '</i>' +
                        'Neighborhood Boundary<br>';


                    div.innerHTML +=
                        '<i class="line-symbol" ' +
                        'style="border-color:#000000; ' +
                        'border-top-width:1px">' +
                        '</i>' +
                        'Census Tract Boundary<br>';


                    // ====================================================
                    // FACILITIES
                    // ====================================================

                    div.innerHTML +=
                        '<div class="legend-section">' +
                        'Protective Layers' +
                        '</div>';


                    div.innerHTML +=
                        '<i class="circle-symbol" ' +
                        'style="' +
                        'background:#4CE600;' +
                        'border:1px solid #FFFFFF' +
                        '"></i>' +
                        'Recreation Centers<br>';


                    div.innerHTML +=
                        '<i class="circle-symbol" ' +
                        'style="' +
                        'background:#0070FF;' +
                        'border:1px solid #FFFFFF' +
                        '"></i>' +
                        'SUD Facilities<br>';


                    return div;
                };


                legend.addTo(map);


                // ========================================================
                // FINISHED
                // ========================================================

                console.log(
                    "Map layers and legend successfully created."
                );

            })


            // ============================================================
            // ERROR HANDLING
            // ============================================================

            .catch(function (error) {

                console.error(
                    "ERROR LOADING MAP DATA:",
                    error
                );

            });

    </script>

</body>

</html>
