<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Denver Social Vulnerability Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map {
            height: 600px;
        }

        /* ============================================================
        LEGEND
        ============================================================ */

        .info.legend {
            padding: 10px 12px;
            background: white;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            line-height: 22px;
            color: #333;
            max-height: 550px;
            overflow-y: auto;
        }

        .info.legend h4 {
            margin: 0 0 6px 0;
            font-size: 15px;
        }

        .info.legend .legend-section {
            clear: both;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        /* Square symbols */

        .info.legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 1;
        }

        /* Circle symbols */

        .info.legend .circle-symbol {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin: 3px 8px 0 3px;
        }

        /* Line symbols */

        .info.legend .line-symbol {
            width: 20px;
            height: 0;
            margin-top: 10px;
            border-top: 3px solid;
            background: none;
        }

        /* Polygon symbol */

        .info.legend .polygon-symbol {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }

        /* ============================================================
   NEIGHBORHOOD LABELS
   ============================================================ */

        .neighborhood-label {
            background: transparent;
            border: none;
            box-shadow: none;

            color: #000000;

            font-family: Arial, sans-serif !important;
            font-weight: 900 !important;
            font-style: normal !important;

            white-space: normal;

            text-align: center;

            line-height: 1.05;

            pointer-events: none;

            transition:
                font-size 0.15s ease,
                opacity 0.15s ease;
        }


        /* Force ALL text inside neighborhood labels to stay bold */
        .neighborhood-label,
        .neighborhood-label *,
        .leaflet-tooltip.neighborhood-label,
        .leaflet-tooltip.neighborhood-label * {
            font-family: Arial, sans-serif !important;
            font-weight: 900 !important;
            font-style: normal !important;
        }


        /* Slightly reinforce very small text */
        .neighborhood-label {
            -webkit-text-stroke: 0.15px currentColor;
        }


        .neighborhood-label::before {
            display: none;
        }

        /* ============================================================
   TOP 5 SCHOOL RANK MARKERS
   ============================================================ */

        .top-school-marker {
            width: 18px;
            height: 18px;

            background: #FFFFFF;

            border: 2px solid #000000;
            border-radius: 50%;

            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);

            pointer-events: auto;
        }


        /* Number inside map marker */
        .top-school-marker .rank-number {
            display: block;

            font-family: Arial, sans-serif;
            font-size: 11px;
            font-weight: 900;

            line-height: 1;

            text-align: center;

            /* Optical correction for Arial numerals */
            transform: translateY(-0.2px);
        }


        .traditional-school-marker .rank-number {
            color: #000000;
        }


        .alternative-school-marker .rank-number {
            color: #F50000;
        }



        /* ============================================================
   TOP 5 SCHOOL LEGEND SYMBOLS
   ============================================================ */

        .school-rank-legend {
            width: 20px;
            height: 20px;

            background: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 50%;

            box-sizing: border-box;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            margin-right: 8px;

            vertical-align: middle;

            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 900;
            line-height: 1;

            /* Prevent other legend CSS from interfering */
            float: none !important;
            opacity: 1 !important;
        }


        /* Fine-tune the actual letter independently */
        .school-rank-legend .legend-letter {
            display: block;

            width: 100%;

            text-align: center;

            font: inherit;
            line-height: 1;

            /* Optical centering */
            transform: translateY(-0.5px);
        }


        /* Traditional */
        .traditional-school-legend {
            color: #000000;
        }


        /* Alternative */
        .alternative-school-legend {
            color: #F50000;
        }
    </style>
</head>


<body>

    <h1>Denver Social Vulnerability Map</h1>

    <div id="map"></div>


    <!-- Leaflet JavaScript -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <script>

        // ============================================================
        // CREATE MAP
        // ============================================================

        var map = L.map('map').setView(
            [39.7392, -104.9903],
            10
        );
        // Keep popup widths readable
        L.Popup.mergeOptions({
            maxWidth: 350
        });


        // ============================================================
        // BASEMAP
        // ============================================================

        var osm = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // ============================================================
        // CREATE MAP PANES
        // Higher zIndex = displayed above lower zIndex
        // ============================================================

        map.createPane('censusPane');
        map.createPane('neighborhoodPane');
        map.createPane('boundaryPane');
        map.createPane('highlightPane');
        map.createPane('pointPane');
        map.createPane('labelPane');
        map.createPane('popupTopPane');
        map.createPane('protectivePolygonPane');
        map.createPane('topSchoolPane');

        map.getPane('labelPane').style.zIndex = 900;
        map.getPane('protectivePolygonPane').style.zIndex = 600;
        map.getPane('labelPane').style.pointerEvents = 'none';
        map.getPane('censusPane').style.zIndex = 300;
        map.getPane('neighborhoodPane').style.zIndex = 500;
        map.getPane('highlightPane').style.zIndex = 400;
        map.getPane('boundaryPane').style.zIndex = 700;
        map.getPane('pointPane').style.zIndex = 800;
        map.getPane('popupTopPane').style.zIndex = 1200;
        map.getPane('topSchoolPane').style.zIndex = 1000;

        console.log(
            "Census z-index:",
            map.getPane('censusPane').style.zIndex
        );

        console.log(
            "Neighborhood z-index:",
            map.getPane('neighborhoodPane').style.zIndex
        );

        console.log(
            "Highlight z-index:",
            map.getPane('highlightPane').style.zIndex
        );

        console.log(
            "Boundary z-index:",
            map.getPane('boundaryPane').style.zIndex
        );

        console.log(
            "Point z-index:",
            map.getPane('pointPane').style.zIndex
        );
        // ============================================================
        // POPUP FUNCTION
        // ============================================================

        function createPopup(feature) {

            var properties = feature.properties;

            if (!properties) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";

            for (var key in properties) {

                if (
                    properties[key] !== null &&
                    properties[key] !== undefined &&
                    properties[key] !== ""
                ) {

                    popupContent +=
                        "<strong>" +
                        key +
                        ":</strong> " +
                        properties[key] +
                        "<br>";
                }
            }

            popupContent += "</div>";

            return popupContent;
        }
        // ============================================================
        // CENSUS TRACT POPUP FUNCTION
        // Shows only relevant, user-friendly Census Tract information
        // ============================================================

        function createCensusPopup(feature) {

            var p = feature.properties;

            if (!p) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";

            // --------------------------------------------------------
            // BASIC INFORMATION
            // --------------------------------------------------------

            var censusTractName =
                p.tract_name ||
                p.NAME;

            if (
                censusTractName !== null &&
                censusTractName !== undefined &&
                censusTractName !== ""
            ) {
                popupContent +=
                    "<strong>Census Tract:</strong> " +
                    censusTractName +
                    "<br>";
            }

            if (p.SVI !== null && p.SVI !== undefined) {
                popupContent +=
                    "<strong>Social Vulnerability Score:</strong> " +
                    Number(p.SVI).toFixed(3) +
                    "<br>";
            }

            if (p.E_TOTPOP !== null && p.E_TOTPOP !== undefined) {
                popupContent +=
                    "<strong>Population:</strong> " +
                    Number(p.E_TOTPOP).toLocaleString() +
                    "<br>";
            }


            // --------------------------------------------------------
            // SOCIOECONOMIC CHARACTERISTICS
            // --------------------------------------------------------

            if (p.EP_POV150 !== null && p.EP_POV150 !== undefined) {
                popupContent +=
                    "<strong>Below 150% of Poverty Level:</strong> " +
                    Number(p.EP_POV150).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_UNEMP !== null && p.EP_UNEMP !== undefined) {
                popupContent +=
                    "<strong>Unemployment:</strong> " +
                    Number(p.EP_UNEMP).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_HBURD !== null && p.EP_HBURD !== undefined) {
                popupContent +=
                    "<strong>Housing Cost Burden:</strong> " +
                    Number(p.EP_HBURD).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_NOHSDP !== null && p.EP_NOHSDP !== undefined) {
                popupContent +=
                    "<strong>Without High School Diploma:</strong> " +
                    Number(p.EP_NOHSDP).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_UNINSUR !== null && p.EP_UNINSUR !== undefined) {
                popupContent +=
                    "<strong>Uninsured:</strong> " +
                    Number(p.EP_UNINSUR).toFixed(1) +
                    "%<br>";
            }


            // --------------------------------------------------------
            // HOUSEHOLD CHARACTERISTICS
            // --------------------------------------------------------

            if (p.EP_AGE65 !== null && p.EP_AGE65 !== undefined) {
                popupContent +=
                    "<strong>Age 65+:</strong> " +
                    Number(p.EP_AGE65).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_AGE17 !== null && p.EP_AGE17 !== undefined) {
                popupContent +=
                    "<strong>Age 17 or Younger:</strong> " +
                    Number(p.EP_AGE17).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_DISABL !== null && p.EP_DISABL !== undefined) {
                popupContent +=
                    "<strong>With a Disability:</strong> " +
                    Number(p.EP_DISABL).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_SNGPNT !== null && p.EP_SNGPNT !== undefined) {
                popupContent +=
                    "<strong>Single-Parent Households:</strong> " +
                    Number(p.EP_SNGPNT).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_LIMENG !== null && p.EP_LIMENG !== undefined) {
                popupContent +=
                    "<strong>Limited English Proficiency:</strong> " +
                    Number(p.EP_LIMENG).toFixed(1) +
                    "%<br>";
            }


            // --------------------------------------------------------
            // DEMOGRAPHIC CHARACTERISTICS
            // --------------------------------------------------------

            if (p.EP_MINRTY !== null && p.EP_MINRTY !== undefined) {
                popupContent +=
                    "<strong>Racial/Ethnic Minority Population:</strong> " +
                    Number(p.EP_MINRTY).toFixed(1) +
                    "%<br>";
            }


            // --------------------------------------------------------
            // HOUSING AND TRANSPORTATION
            // --------------------------------------------------------

            if (p.EP_MUNIT !== null && p.EP_MUNIT !== undefined) {
                popupContent +=
                    "<strong>Multi-Unit Housing:</strong> " +
                    Number(p.EP_MUNIT).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_MOBILE !== null && p.EP_MOBILE !== undefined) {
                popupContent +=
                    "<strong>Mobile Homes:</strong> " +
                    Number(p.EP_MOBILE).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_CROWD !== null && p.EP_CROWD !== undefined) {
                popupContent +=
                    "<strong>Crowded Housing:</strong> " +
                    Number(p.EP_CROWD).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_NOVEH !== null && p.EP_NOVEH !== undefined) {
                popupContent +=
                    "<strong>Households Without a Vehicle:</strong> " +
                    Number(p.EP_NOVEH).toFixed(1) +
                    "%<br>";
            }

            if (p.EP_GROUPQ !== null && p.EP_GROUPQ !== undefined) {
                popupContent +=
                    "<strong>Population in Group Quarters:</strong> " +
                    Number(p.EP_GROUPQ).toFixed(1) +
                    "%<br>";
            }


            popupContent += "</div>";

            return popupContent;
        }
        // ============================================================
        // SCHOOL POPUP FUNCTION
        // ============================================================

        function createSchoolPopup(feature) {

            var p = feature.properties;

            if (!p) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";


            // --------------------------------------------------------
            // BASIC INFORMATION
            // --------------------------------------------------------

            if (p.school_name) {

                popupContent +=
                    "<strong>School Name:</strong> " +
                    p.school_name +
                    "<br>";
            }

            if (p.SRI_score !== null && p.SRI_score !== undefined) {
                popupContent +=
                    "<strong>School Risk Index Score:</strong> " +
                    Number(p.SRI_score).toFixed(3) +
                    "<br>";
            }


            if (p.school_type) {
                popupContent +=
                    "<strong>School Type:</strong> " +
                    p.school_type +
                    "<br>";
            }


            if (p.classification) {
                popupContent +=
                    "<strong>Classification:</strong> " +
                    p.classification +
                    "<br>";
            }


            if (p.school_level) {
                popupContent +=
                    "<strong>School Level:</strong> " +
                    p.school_level +
                    "<br>";
            }


            if (p.grade_level) {
                popupContent +=
                    "<strong>Grades Served:</strong> " +
                    p.grade_level +
                    "<br>";
            }


            // --------------------------------------------------------
            // LOCATION
            // --------------------------------------------------------

            if (p.address) {
                popupContent +=
                    "<strong>Address:</strong> " +
                    p.address +
                    "<br>";
            }


            if (p.neighborhood) {
                popupContent +=
                    "<strong>Neighborhood:</strong> " +
                    p.neighborhood +
                    "<br>";
            }


            // --------------------------------------------------------
            // SCHOOL INDICATORS
            // --------------------------------------------------------

            if (
                p.student_teacher_ratio !== null &&
                p.student_teacher_ratio !== undefined
            ) {
                popupContent +=
                    "<strong>Student-Teacher Ratio:</strong> " +
                    Number(p.student_teacher_ratio).toFixed(1) +
                    ":1<br>";
            }


            if (
                p.attendance_rate !== null &&
                p.attendance_rate !== undefined
            ) {
                popupContent +=
                    "<strong>Attendance Rate:</strong> " +
                    (Number(p.attendance_rate) * 100).toFixed(1) +
                    "%<br>";
            }


            if (
                p.chronically_absent !== null &&
                p.chronically_absent !== undefined
            ) {
                popupContent +=
                    "<strong>Chronic Absenteeism:</strong> " +
                    (Number(p.chronically_absent) * 100).toFixed(1) +
                    "%<br>";
            }


            if (
                p.truancy_rate !== null &&
                p.truancy_rate !== undefined
            ) {
                popupContent +=
                    "<strong>Truancy Rate:</strong> " +
                    (Number(p.truancy_rate) * 100).toFixed(1) +
                    "%<br>";
            }


            if (
                p.perf_rating !== null &&
                p.perf_rating !== undefined
            ) {
                popupContent +=
                    "<strong>Performance Rating:</strong> " +
                    (Number(p.perf_rating) * 100).toFixed(1) +
                    "%<br>";
            }


            popupContent += "</div>";

            return popupContent;
        }



        // ============================================================
        // RECREATION CENTER POPUP FUNCTION
        // ============================================================

        function createRecreationPopup(feature) {

            var p = feature.properties;

            if (!p) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";


            // --------------------------------------------------------
            // BASIC INFORMATION
            // --------------------------------------------------------

            if (
                p.REC_NAME !== null &&
                p.REC_NAME !== undefined &&
                p.REC_NAME !== ""
            ) {
                popupContent +=
                    "<strong>Recreation Center:</strong> " +
                    p.REC_NAME +
                    "<br>";
            }


            if (
                p.REC_TYPE !== null &&
                p.REC_TYPE !== undefined &&
                p.REC_TYPE !== ""
            ) {
                popupContent +=
                    "<strong>Center Type:</strong> " +
                    p.REC_TYPE +
                    "<br>";
            }


            // --------------------------------------------------------
            // ADDRESS
            // --------------------------------------------------------

            if (
                p.ADDRESS_LI !== null &&
                p.ADDRESS_LI !== undefined &&
                p.ADDRESS_LI !== ""
            ) {

                popupContent +=
                    "<strong>Address:</strong> " +
                    p.ADDRESS_LI;

                if (
                    p.CITY !== null &&
                    p.CITY !== undefined &&
                    p.CITY !== ""
                ) {
                    popupContent += ", " + p.CITY;
                }

                if (
                    p.STATE !== null &&
                    p.STATE !== undefined &&
                    p.STATE !== ""
                ) {
                    popupContent += ", " + p.STATE;
                }

                if (
                    p.ZIP !== null &&
                    p.ZIP !== undefined &&
                    p.ZIP !== ""
                ) {
                    popupContent += " " + p.ZIP;
                }

                popupContent += "<br>";
            }


            // --------------------------------------------------------
            // CONTACT INFORMATION
            // --------------------------------------------------------

            if (
                p.PHONE !== null &&
                p.PHONE !== undefined &&
                p.PHONE !== ""
            ) {
                popupContent +=
                    "<strong>Phone:</strong> " +
                    p.PHONE +
                    "<br>";
            }


            // --------------------------------------------------------
            // FACILITIES AND PROGRAMS
            // --------------------------------------------------------

            if (
                p.MARKETED_F !== null &&
                p.MARKETED_F !== undefined &&
                p.MARKETED_F !== ""
            ) {
                popupContent +=
                    "<strong>Facilities & Amenities:</strong> " +
                    p.MARKETED_F +
                    "<br>";
            }


            if (
                p.MARKETED_P !== null &&
                p.MARKETED_P !== undefined &&
                p.MARKETED_P !== ""
            ) {
                popupContent +=
                    "<strong>Programs & Activities:</strong> " +
                    p.MARKETED_P +
                    "<br>";
            }


            // --------------------------------------------------------
            // WEBSITE
            // --------------------------------------------------------

            if (
                p.NEWS_LINK !== null &&
                p.NEWS_LINK !== undefined &&
                p.NEWS_LINK !== ""
            ) {

                var website = p.NEWS_LINK;

                if (
                    !website.startsWith("http://") &&
                    !website.startsWith("https://")
                ) {
                    website = "https://" + website;
                }

                popupContent +=
                    '<strong>Website:</strong> ' +
                    '<a href="' +
                    website +
                    '" target="_blank" rel="noopener noreferrer">' +
                    'View Recreation Center Website' +
                    '</a><br>';
            }


            popupContent += "</div>";

            return popupContent;
        }
        // ============================================================
        // SUD FACILITY POPUP FUNCTION
        // ============================================================

        function createSUDPopup(feature) {

            var p = feature.properties;

            if (!p) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";


            // --------------------------------------------------------
            // BASIC INFORMATION
            // --------------------------------------------------------

            if (
                p.FacilityNa !== null &&
                p.FacilityNa !== undefined &&
                p.FacilityNa !== ""
            ) {
                popupContent +=
                    "<strong>Facility Name:</strong> " +
                    p.FacilityNa +
                    "<br>";
            }


            if (
                p.Address !== null &&
                p.Address !== undefined &&
                p.Address !== ""
            ) {
                popupContent +=
                    "<strong>Address:</strong> " +
                    p.Address +
                    "<br>";
            }


            if (
                p.CNTYNAME !== null &&
                p.CNTYNAME !== undefined &&
                p.CNTYNAME !== ""
            ) {
                popupContent +=
                    "<strong>County:</strong> " +
                    p.CNTYNAME +
                    " County<br>";
            }


            if (
                p.Year !== null &&
                p.Year !== undefined &&
                p.Year !== ""
            ) {
                popupContent +=
                    "<strong>Facility Data Year:</strong> " +
                    p.Year +
                    "<br>";
            }


            // --------------------------------------------------------
            // SERVICES
            // --------------------------------------------------------

            var services = [];


            if (Number(p.OP) === 1) {
                services.push("Outpatient Services");
            }


            if (Number(p.RES) === 1) {
                services.push("Residential Services");
            }


            if (Number(p.DT) === 1) {
                services.push("Detoxification Services");
            }


            if (Number(p.TELE) === 1) {
                services.push("Telehealth Services");
            }


            if (services.length > 0) {

                popupContent +=
                    "<strong>Services:</strong> " +
                    services.join(", ") +
                    "<br>";
            }


            popupContent += "</div>";

            return popupContent;
        }
        // ============================================================
        // FARMERS MARKET POPUP FUNCTION
        // ============================================================

        function createFarmersMarketPopup(feature) {

            var p = feature.properties;

            if (!p) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";


            // --------------------------------------------------------
            // BASIC INFORMATION
            // --------------------------------------------------------

            if (
                p.NAME !== null &&
                p.NAME !== undefined &&
                p.NAME !== ""
            ) {
                popupContent +=
                    "<strong>Farmers Market:</strong> " +
                    p.NAME +
                    "<br>";
            }


            if (
                p.LOCATION_G !== null &&
                p.LOCATION_G !== undefined &&
                p.LOCATION_G !== ""
            ) {
                popupContent +=
                    "<strong>Location Details:</strong> " +
                    p.LOCATION_G +
                    "<br>";
            }


            // --------------------------------------------------------
            // ADDRESS
            // --------------------------------------------------------

            if (
                p.ADDRESS_FU !== null &&
                p.ADDRESS_FU !== undefined &&
                p.ADDRESS_FU !== ""
            ) {
                popupContent +=
                    "<strong>Address:</strong> " +
                    p.ADDRESS_FU +
                    "<br>";
            }


            // --------------------------------------------------------
            // STATUS / SEASON
            // --------------------------------------------------------

            if (
                p.STATUS !== null &&
                p.STATUS !== undefined &&
                p.STATUS !== ""
            ) {
                popupContent +=
                    "<strong>Season / Status:</strong> " +
                    p.STATUS +
                    "<br>";
            }


            // --------------------------------------------------------
            // FOOD ACCESS PROGRAMS
            // --------------------------------------------------------

            if (
                p.SNAP !== null &&
                p.SNAP !== undefined &&
                p.SNAP !== ""
            ) {
                popupContent +=
                    "<strong>SNAP Accepted:</strong> " +
                    p.SNAP +
                    "<br>";
            }


            if (
                p.DOUBLE_UP_ !== null &&
                p.DOUBLE_UP_ !== undefined &&
                p.DOUBLE_UP_ !== ""
            ) {
                popupContent +=
                    "<strong>Double Up Food Bucks:</strong> " +
                    p.DOUBLE_UP_ +
                    "<br>";
            }


            popupContent += "</div>";

            return popupContent;
        }
        // ============================================================
        // PARK POPUP FUNCTION
        // ============================================================

        function createParkPopup(feature) {

            var p = feature.properties;

            if (!p) {
                return "<strong>No information available</strong>";
            }

            var popupContent = "<div>";

            if (p.FORMAL_NAM) {
                popupContent +=
                    "<strong>Park Name:</strong> " +
                    p.FORMAL_NAM +
                    "<br>";
            }

            if (p.PARK_TYPE) {
                popupContent +=
                    "<strong>Park Type:</strong> " +
                    p.PARK_TYPE +
                    "<br>";
            }

            if (p.PARK_CLASS) {
                popupContent +=
                    "<strong>Park Classification:</strong> " +
                    p.PARK_CLASS +
                    "<br>";
            }

            if (
                p.GIS_ACRES !== null &&
                p.GIS_ACRES !== undefined
            ) {
                popupContent +=
                    "<strong>Size:</strong> " +
                    Number(p.GIS_ACRES).toFixed(1) +
                    " acres<br>";
            }

            if (p.ADDRESS_LI) {

                popupContent +=
                    "<strong>Address:</strong> " +
                    p.ADDRESS_LI;

                if (p.CITY) {
                    popupContent += ", " + p.CITY;
                }

                if (p.STATE) {

                // ========================================================
                // DYNAMIC NEIGHBORHOOD LABEL PLACEMENT
                // ========================================================


                // --------------------------------------------------------
                // POINT-IN-RING TEST
                //
                // Used to determine whether a proposed label position
                // is actually inside the neighborhood polygon.
                // --------------------------------------------------------

                function pointInRing(point, ring) {

                    var x = point.lng;
                    var y = point.lat;

                    var inside = false;

                    for (
                        var i = 0, j = ring.length - 1;
                        i < ring.length;
                        j = i++
                    ) {

                        var xi = ring[i][0];
                        var yi = ring[i][1];

                        var xj = ring[j][0];
                        var yj = ring[j][1];


                        var intersects =
                            ((yi > y) !== (yj > y)) &&
                            (
                                x <
                                (xj - xi) *
                                (y - yi) /
                                ((yj - yi) || 0.0000001) +
                                xi
                            );


                        if (intersects) {
                            inside = !inside;
                        }

                    }

                    return inside;
                }


                // --------------------------------------------------------
                // CHECK ONE POLYGON
                //
                // GeoJSON polygons may contain:
                //
                // ring 0 = exterior boundary
                // ring 1+ = holes
                // --------------------------------------------------------

                function pointInPolygonCoordinates(
                    point,
                    polygonCoordinates
                ) {

                    if (
                        !polygonCoordinates ||
                        polygonCoordinates.length === 0
                    ) {
                        return false;
                    }


                    // Must be inside exterior ring

                    if (
                        !pointInRing(
                            point,
                            polygonCoordinates[0]
                        )
                    ) {

                        return false;

                    }


                    // Must NOT be inside a hole

                    for (
                        var i = 1;
                        i < polygonCoordinates.length;
                        i++
                    ) {

                        if (
                            pointInRing(
                                point,
                                polygonCoordinates[i]
                            )
                        ) {

                            return false;

                        }

                    }


                    return true;
                }


                // --------------------------------------------------------
                // CHECK WHETHER A LABEL BOX FITS INSIDE ITS NEIGHBORHOOD
                //
                // We test:
                // center
                // four corners
                // four edge midpoints
                //
                // This makes it much harder for text to cross a
                // neighborhood boundary.
                // --------------------------------------------------------

                function labelFitsInsideNeighborhood(
                    box,
                    feature
                ) {

                    if (
                        !feature ||
                        !feature.geometry
                    ) {

                        return true;

                    }


                    var geometry =
                        feature.geometry;


                    // Screen positions to test

                    var screenPoints = [

                        // Center
                        L.point(
                            (box.left + box.right) / 2,
                            (box.top + box.bottom) / 2
                        ),

                        // Corners
                        L.point(
                            box.left,
                            box.top
                        ),

                        L.point(
                            box.right,
                            box.top
                        ),

                        L.point(
                            box.left,
                            box.bottom
                        ),

                        L.point(
                            box.right,
                            box.bottom
                        ),

                        // Top midpoint
                        L.point(
                            (box.left + box.right) / 2,
                            box.top
                        ),

                        // Bottom midpoint
                        L.point(
                            (box.left + box.right) / 2,
                            box.bottom
                        ),

                        // Left midpoint
                        L.point(
                            box.left,
                            (box.top + box.bottom) / 2
                        ),

                        // Right midpoint
                        L.point(
                            box.right,
                            (box.top + box.bottom) / 2
                        )

                    ];


                    // Convert screen coordinates back to geographic coordinates

                    var geographicPoints =
                        screenPoints.map(function (point) {

                            return map.containerPointToLatLng(
                                point
                            );

                        });


                    // ====================================================
                    // NORMAL POLYGON
                    // ====================================================

                    if (
                        geometry.type === "Polygon"
                    ) {

                        return geographicPoints.every(
                            function (point) {

                                return pointInPolygonCoordinates(
                                    point,
                                    geometry.coordinates
                                );

                            }
                        );

                    }


                    // ====================================================
                    // MULTIPOLYGON
                    //
                    // All sample points must fit inside the SAME polygon
                    // component.
                    // ====================================================

                    if (
                        geometry.type === "MultiPolygon"
                    ) {

                        return geometry.coordinates.some(
                            function (polygonCoordinates) {

                                return geographicPoints.every(
                                    function (point) {

                                        return pointInPolygonCoordinates(
                                            point,
                                            polygonCoordinates
                                        );

                                    }
                                );

                            }
                        );

                    }


                    return true;
                }

                // ========================================================
                // CREATE POSSIBLE MULTI-LINE LABEL FORMATS
                // ========================================================

                function createLabelLayouts(text) {

                    var words =
                        text
                            .trim()
                            .split(/\s+/);


                    var layouts = [];


                    // ----------------------------------------------------
                    // OPTION 1:
                    // Entire neighborhood name on one line
                    // ----------------------------------------------------

                    layouts.push(
                        text
                    );


                    // ----------------------------------------------------
                    // OPTION 2:
                    // If there are multiple words,
                    // split roughly in half
                    // ----------------------------------------------------

                    if (words.length >= 2) {

                        var middle =
                            Math.ceil(
                                words.length / 2
                            );


                        var firstHalf =
                            words
                                .slice(0, middle)
                                .join(" ");


                        var secondHalf =
                            words
                                .slice(middle)
                                .join(" ");


                        if (secondHalf) {

                            layouts.push(
                                firstHalf +
                                "<br>" +
                                secondHalf
                            );

                        }

                    }


                    // ----------------------------------------------------
                    // OPTION 3:
                    // For 3+ words, try approximately three lines
                    // ----------------------------------------------------

                    if (words.length >= 3) {

                        var lines = [];

                        var wordsPerLine =
                            Math.ceil(
                                words.length / 3
                            );


                        for (
                            var i = 0;
                            i < words.length;
                            i += wordsPerLine
                        ) {

                            lines.push(
                                words
                                    .slice(
                                        i,
                                        i + wordsPerLine
                                    )
                                    .join(" ")
                            );

                        }


                        layouts.push(
                            lines.join("<br>")
                        );

                    }


                    // ----------------------------------------------------
                    // OPTION 4:
                    // One word per line
                    //
                    // Most compact horizontally
                    // ----------------------------------------------------

                    if (words.length >= 2) {

                        layouts.push(
                            words.join("<br>")
                        );

                    }


                    return layouts;
                }

                // ========================================================
                // UPDATE NEIGHBORHOOD LABELS
                // ========================================================

                function updateNeighborhoodLabels() {

                    var zoom =

                    // HIDE LABELS WHEN ZOOMED OUT
                    // ====================================================

                    }



                    // ====================================================
                    // COLLECT POINT FEATURES
                    //
                    // Neighborhood labels will try to avoid these.
                    // ====================================================

                    var obstaclePoints = [];


                    function collectPointObstacles(
                        layerGroup
                    ) {

                        if (
                            !layerGroup ||
                            !map.hasLayer(layerGroup)
                        ) {

                            return;

                        }


                        layerGroup.eachLayer(
                            function (layer) {

                                if (

                                    var point =
                                        map.latLngToContainerPoint(
                                            layer.getLatLng()

                    collectPointObstacles(
                        schools
                    );

                    collectPointObstacles(
                        traditionalSchools
                    );

                    collectPointObstacles(
                        alternativeSchools
                    );

                    collectPointObstacles(
                        recreationCenters
                    );

                    collectPointObstacles(
                        sudFacilities
                    );
                    collectPointObstacles(
                        farmersMarkets
                    );
                    collectPointObstacles(
                        swimmingPools
                    );

                    collectPointObstacles(
                        libraries
                    );

                    collectPointObstacles(
                        skateparks
                    );



                    // ====================================================
                    // TRACK LABELS ALREADY PLACED
                    // ====================================================

                    var occupiedBoxes = [];



                    // ====================================================
                    // BASE FONT SIZE
                    //
                    // Automatically increases as user zooms in.
                    // ====================================================

                    var preferredFontSize =
                        Math.min(
                            16,
                            9 + ((zoom - 13) * 1.5)
                        );



                    // ====================================================
                    // PROCESS EVERY NEIGHBORHOOD
                    // ====================================================

                    neighborhoods.eachLayer(
                        function (layer) {

                            var tooltip =
                                layer.getTooltip();


                            if (!tooltip) {
                                return;
                            }


                            layer.openTooltip();


                            var tooltipElement =
                                tooltip.getElement();
                            // =================================================
                            // ORIGINAL NEIGHBORHOOD NAME
                            // =================================================

                            var neighborhoodName =
                                layer.feature &&
                                    layer.feature.properties
                                    ? layer.feature.properties.NBHD_NAME
                                    : "";


                            var labelLayouts =
                                createLabelLayouts(
                                    neighborhoodName
                                );

                            if (!tooltipElement) {
                                return;
                            }


                            // Hide while calculating

                            tooltip.setOpacity(0);



                            // =================================================
                            // GET NEIGHBORHOOD CENTER
                            // =================================================

                            if (
                                !layer.getBounds
                            ) {

                                return;

                            }


                            var center =
                                layer
                                    .getBounds()
                                    .getCenter();


                            var centerPoint =
                                map.latLngToContainerPoint(
                                    center
                                );



                            // =================================================
                            // POSSIBLE LABEL POSITIONS
                            //
                            // Starts close to center and gradually expands.
                            // =================================================

                            var offsets = [

                                // Center
                                [0, 0],

                                // Slight movement
                                [0, -12],
                                [0, 12],
                                [-18, 0],
                                [18, 0],

                                // Diagonals
                                [-18, -12],
                                [18, -12],
                                [-18, 12],
                                [18, 12],

                                // Greater movement
                                [0, -25],
                                [0, 25],
                                [-35, 0],
                                [35, 0],

                                // Greater diagonals
                                [-30, -20],
                                [30, -20],
                                [-30, 20],
                                [30, 20],

                                // Even farther
                                [0, -40],
                                [0, 40],
                                [-50, 0],
                                [50, 0]

                            ];



                            var placed = false;

                            var fontSize =
                                preferredFontSize;



                            // =================================================
                            // TRY DIFFERENT FONT SIZES
                            // =================================================

                            while (
                                fontSize >= 5 &&
                                !placed
                            ) {

                                tooltipElement.style.fontSize =
                                    fontSize + "px";


                                // =================================================
                                // TRY EACH TEXT LAYOUT
                                //
                                // 1 line
                                // 2 lines
                                // 3 lines
                                // one word per line
                                // =================================================

                                for (
                                    var layoutIndex = 0;
                                    layoutIndex < labelLayouts.length;
                                    layoutIndex++
                                ) {

                                    var currentLayout =
                                        labelLayouts[
                                        layoutIndex
                                        ];


                                    // Apply this version of the label

                                    tooltipElement.innerHTML =
                                        "<strong>" +
                                        currentLayout +
                                        "</strong>";


                                    // Always force bold styling

                                    tooltipElement.style.fontWeight =
                                        "900";


                                    tooltipElement.style.textAlign =
                                        "center";


                                    tooltipElement.style.lineHeight =
                                        "1.05";


                                    // Force browser to calculate actual dimensions

                                    var width =
                                        tooltipElement.offsetWidth;


                                    var height =
                                        tooltipElement.offsetHeight;



                                    // =================================================
                                    // TRY EACH POSSIBLE POSITION
                                    // =================================================

                                    for (
                                        var i = 0;
                                        i < offsets.length;
                                        i++
                                    ) {

                                        var offsetX =
                                            offsets[i][0];


                                        var offsetY =
                                            offsets[i][1];


                                        var x =
                                            centerPoint.x +
                                            offsetX;


                                        var y =
                                            centerPoint.y +
                                            offsetY;



                                        // =============================================
                                        // BUILD LABEL BOUNDING BOX
                                        // =============================================

                                        var box = {

                                            left:
                                                x -
                                                width / 2,

                                                x +
                                                width / 2,

                                            top:
                                                y -
                                                height / 2,

                                            bottom:
                                                y +
                                                height / 2

                                        // CONDITION 1:
                                        // LABEL MUST FIT INSIDE NEIGHBORHOOD
                                        // =============================================

                                        // CONDITION 2:

                                        // =============================================

                                            10;


                                        for (
                                            var p = 0;
                                            p < obstaclePoints.length;
                                            p++

                                            var obstacle =
                                                obstaclePoints[p];


                                            if (
                                                obstacle.x >
                                                box.left -
                                                pointPadding &&

                                                obstacle.x <
                                                box.right +
                                                pointPadding &&

                                                obstacle.y >
                                                box.top -
                                                pointPadding &&

                                                obstacle.y <
                                                box.bottom +
                                                pointPadding
                                            ) {

                                                collision =
                                                    true;

                                                break;

                                            }

                                        }


                                        if (collision) {

                                            continue;

                                        }



                                        // =============================================
                                        // CONDITION 3:

                                                    other.left ||

                                                    labelPadding >
                                                    other.right ||

                                                    box.bottom +
                                                    labelPadding <
                                                    other.top ||

                                                    box.top -
                                                    labelPadding >
                                                    other.bottom
                                                );

                                            }

                    // Protective Layer
                    // ====================================================

                    if (map.hasLayer(sudFacilities)) {

                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#0070FF;' +
                            'border:1px solid #FFFFFF' +
                            '"></i>' +
                            'SUD Facilities<br>';
                    }
                    // ====================================================
                    // FARMERS MARKETS
                    // Protective Layer
                    // ====================================================

                    if (map.hasLayer(farmersMarkets)) {

                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="' +
                            'background:#FFAA00;' +
                            'border:1px solid #FFFFFF' +
                            '"></i>' +
                            'Farmers Markets<br>';
                    }

                    if (map.hasLayer(swimmingPools)) {

                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="background:#00BFFF;' +
                            'border:1px solid #FFFFFF"></i>' +
                            'Swimming Pools<br>';
                    }


                    if (map.hasLayer(libraries)) {

                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="background:#8A2BE2;' +
                            'border:1px solid #FFFFFF"></i>' +
                            'Libraries<br>';
                    }


                    if (map.hasLayer(skateparks)) {

                        div.innerHTML +=
                            '<i class="circle-symbol" ' +
                            'style="background:#555555;' +
                            'border:1px solid #FFFFFF"></i>' +
                            'Skateparks<br>';
                    }


                    // ====================================================
                    // CENSUS TRACT BOUNDARY
                    // ====================================================
                    // This is always included with Census Tracts.
                    // It is intentionally not given its own legend
                    // symbol because the SVI colors already explain
                    // the Census Tract layer.
                    // ====================================================


                }


                // ========================================================
                // INITIAL LEGEND
                // Shows all layers that are currently displayed.
                // ========================================================

                updateLegend();


                // ========================================================
                // UPDATE LEGEND WHEN A LAYER IS TURNED ON
                // ========================================================

                map.on('overlayadd', function () {

                    updateLegend();

                });


                // ========================================================
                // UPDATE LEGEND WHEN A LAYER IS TURNED OFF
                // ========================================================

                map.on('overlayremove', function () {

                    updateLegend();

                });


                console.log(
                    "Map layers and legend successfully created."
                );

            })


            // ============================================================
            // ERROR HANDLING
            // ============================================================

            .catch(function (error) {

                console.error(
                    "ERROR LOADING MAP DATA:",
                    error
                );

            });

    </script>

</body>

</html>
